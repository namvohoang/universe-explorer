<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 3D space explorer for kids: fly around the solar system, find our home in the Milky Way, and see a black hole up close.">
<title>Universe Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#060914;
  --panel:rgba(15,22,46,.84);
  --line:rgba(160,180,255,.2);
  --ink:#F4EEDC;
  --ink-dim:#AEB6D2;
  --sun:#FFC53D;
  --sun-ink:#2A1A00;
  --sky:#6FD3FF;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#labels.off{display:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;font:700 13px/1 var(--body);color:var(--ink);background:rgba(6,9,20,.6);border:1px solid var(--line);border-radius:999px;padding:5px 9px;min-height:0;white-space:nowrap;cursor:pointer;will-change:transform}
.lbl:hover{border-color:var(--sun);color:var(--sun)}

button{font:700 14px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;min-height:38px;padding:0 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,border-color .15s}
button:hover{border-color:rgba(255,197,61,.6)}
button[aria-pressed="true"],button[aria-selected="true"],button.on{background:var(--sun);color:var(--sun-ink);border-color:transparent}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.top{position:fixed;z-index:3;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,32px);line-height:1;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.brand h1 span{color:var(--sun)}
.brand p{margin:6px 0 0;color:var(--ink-dim);font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;min-height:32px;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--sun)}

.tray{position:fixed;z-index:3;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.tray>*{pointer-events:auto}
.clock{align-self:flex-start;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.clock b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--sun)}
.clock .sep{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot);flex:none}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;max-width:230px;min-height:54px;border-radius:16px;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.card{position:fixed;z-index:4;right:16px;top:calc(96px + env(safe-area-inset-top,0px));width:min(370px,calc(100% - 32px));max-height:calc(100% - 300px);overflow:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:14px}
.card-head{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.swatch{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0,var(--c) 38%,#0008 100%);box-shadow:0 0 18px var(--c)}
.eyebrow{margin:0 0 3px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sky)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;text-wrap:balance}
.x{width:38px;padding:0;font-size:22px}
.hello{margin:0;font-size:17px;line-height:1.45;max-width:60ch}
.stats{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.stats dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.stats dd{margin:3px 0 0;font-family:var(--display);font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px;color:var(--sun);letter-spacing:.02em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{position:relative;padding-left:22px;line-height:1.45}
.facts li::before{content:"✦";position:absolute;left:0;top:0;color:var(--sun)}
.card-actions{display:flex;gap:8px}
.primary{background:var(--sun);color:var(--sun-ink);border-color:transparent;min-height:44px;padding:0 18px;font-size:15px}

#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);box-sizing:border-box;background:var(--panel);border:1px solid var(--sun);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.4;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#voice{font-variant-numeric:tabular-nums}
#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--void);font-family:var(--display);font-size:26px;text-align:center;padding:0 16px}
#loading small{display:block;font-family:var(--body);font-size:15px;color:var(--ink-dim);margin-top:8px}

@media (max-width:700px){
  #toast{top:calc(120px + env(safe-area-inset-top,0px))}
  .brand p{display:none}
  .card{top:auto;left:16px;right:16px;width:auto;bottom:calc(206px + env(safe-area-inset-bottom,0px));max-height:38%;padding:14px}
  .card h2{font-size:25px}
  .hello{font-size:16px}
  .tabs button{font-size:16px;min-height:48px}
  .clock{font-size:12px}
}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Interactive 3D view of space. Drag to look around, pinch or scroll to zoom."></canvas>
<div id="labels"></div>

<header class="top">
  <div class="brand">
    <h1>Universe <span>Explorer</span></h1>
    <p id="hint">Tap a planet or its name to fly there</p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Speed">
      <button type="button" id="sp-pause" data-speed="pause" aria-pressed="false">Pause</button>
      <button type="button" id="sp-slow" data-speed="slow" aria-pressed="false">Slow</button>
      <button type="button" id="sp-normal" data-speed="normal" aria-pressed="true">Normal</button>
      <button type="button" id="sp-fast" data-speed="fast" aria-pressed="false">Fast</button>
    </div>
    <button type="button" id="names" aria-pressed="true">Names</button>
    <button type="button" id="voice" aria-pressed="false" title="Download a more natural reading voice (about 90 MB)">Natural voice</button>
  </div>
</header>

<aside class="card" id="card" hidden aria-live="polite">
  <div class="card-head">
    <span class="swatch" id="c-swatch"></span>
    <div>
      <p class="eyebrow" id="c-eyebrow"></p>
      <h2 id="c-name"></h2>
    </div>
    <button type="button" class="x" id="c-close" aria-label="Close card">×</button>
  </div>
  <p class="hello" id="c-hello"></p>
  <dl class="stats" id="c-stats"></dl>
  <h3>Cool facts</h3>
  <ul class="facts" id="c-facts"></ul>
  <div class="card-actions"><button type="button" class="primary" id="c-read">Read it to me</button></div>
</aside>

<nav class="tray" aria-label="Places to explore">
  <div class="clock" id="clock"><span><b id="years">0.0</b> Earth years went by</span><span class="sep">·</span><span id="yearlen">1 year = 20 seconds</span></div>
  <div class="chips" id="chips"></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-solar" data-scene="solar" aria-selected="true">Solar System</button>
    <button type="button" role="tab" id="tab-galaxy" data-scene="galaxy" aria-selected="false">Milky Way</button>
    <button type="button" role="tab" id="tab-blackhole" data-scene="blackhole" aria-selected="false">Black Hole</button>
  </div>
</nav>

<div id="toast" role="status" hidden></div>

<div id="loading">Loading the universe…<small>Getting the planets ready</small></div>

<script>
  window.addEventListener('error', function(e){
    var l=document.getElementById('loading');
    if(l && !l.hidden){ l.innerHTML='Something went wrong while starting the universe.<small></small>'; l.querySelector('small').textContent=String(e.message||e.error||'Unknown error'); }
  });
</script>

mars:{name:"Mars",eyebrow:"Planet \xB7 4th from the Sun",color:"#D0643A",hello:"Mars is the red planet. Its dirt is full of rusty iron, which makes it look red.",stats:[["Day","24 h 40 min"],["Year","687 Earth days"],["Moons","2"],["Size","0.5 Earths wide"]],facts:["Olympus Mons on Mars is the biggest volcano in the solar system, about 2.5 times taller than Mount Everest.","Robot rovers are driving on Mars right now, exploring it for us.","Mars has two tiny moons named Phobos and Deimos."]},jupiter:{name:"Jupiter",eyebrow:"Planet \xB7 5th from the Sun",color:"#D8B48A",hello:"Jupiter is the biggest planet, a giant ball of gas with no ground to stand on.",stats:[["Day","10 hours"],["Year","12 Earth years"],["Moons","90+"],["Size","11 Earths wide"]],facts:["More than 1,300 Earths could fit inside Jupiter.","The Great Red Spot is a storm bigger than Earth. It has been swirling for hundreds of years.","Jupiter has the shortest day of any planet."]},saturn:{name:"Saturn",eyebrow:"Planet \xB7 6th from the Sun",color:"#E9D6A8",hello:"Saturn is famous for its rings, made of billions of chunks of ice and rock.",stats:[["Day","10.7 hours"],["Year","29 Earth years"],["Moons","270+"],["Size","9 Earths wide"]],facts:["Saturn is so light for its size that it would float in a giant bathtub.","Some ring pieces are as small as sand grains. Others are as big as a house.","Saturn has more moons than any other planet."]},uranus:{name:"Uranus",eyebrow:"Planet \xB7 7th from the Sun",color:"#9FE3E8",hello:"Uranus is an ice giant that spins on its side, like a ball rolling around the Sun.",stats:[["Day","17 hours"],["Year","84 Earth years"],["Moons","28+"],["Size","4 Earths wide"]],facts:["Uranus is the coldest planet: its air can reach -224 \xB0C.","Its blue-green color comes from a gas called methane.","Uranus has thin, dark rings too."]},neptune:{name:"Neptune",eyebrow:"Planet \xB7 8th from the Sun",color:"#4A7BE6",hello:"Neptune is the farthest planet from the Sun. It is dark, cold, and very windy.",stats:[["Day","16 hours"],["Year","165 Earth years"],["Moons","16"],["Size","4 Earths wide"]],facts:["Neptune has the fastest winds in the solar system, faster than a jet plane.","Scientists found Neptune using math before anyone saw it in a telescope.","Since it was discovered in 1846, Neptune has gone around the Sun only once."]},galaxy:{name:"The Milky Way",eyebrow:"Galaxy \xB7 our home",color:"#9FC4FF",hello:"This is the Milky Way, a giant spinning city of stars. Our Sun is just one of them!",stats:[["Stars","100 to 400 billion"],["Width","100,000 light-years"],["Shape","Spiral"],["Age","about 13 billion years"]],facts:["Light is the fastest thing there is, and it would still need 100,000 years to cross the Milky Way.","On a very dark night you can see part of it as a cloudy band across the sky.","Our Sun takes about 230 million years to go around the galaxy once."]},here:{name:"You Are Here",eyebrow:"Our Sun in the galaxy",color:"#FFC53D",hello:"Our whole solar system is this tiny spot, about halfway out from the center, in a small arm called the Orion Arm.",stats:[["To the center","26,000 light-years"],["One trip around","230 million years"],["Speed","800,000 km/h"],["Nearest star","4.2 light-years"]],facts:["The nearest star, Proxima Centauri, is so far away that its light takes over 4 years to reach us.","We are racing around the galaxy right now, even while you sit still!","If the whole Milky Way were the size of a big city, our solar system would be smaller than a grain of sand."]},sgr:{name:"Sagittarius A*",eyebrow:"Black hole \xB7 center of the galaxy",color:"#FFD9A0",hello:"Right in the middle of the Milky Way hides a supermassive black hole. The whole galaxy circles around it.",stats:[["Heavy as","4 million Suns"],["Distance","26,000 light-years"],["Say it","Sagittarius A-star"],["First photo","2022"]],facts:["Stars near it whip around at thousands of kilometers every second.","It is fairly quiet. It only snacks on a little gas now and th
