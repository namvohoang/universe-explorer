<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Kids first: the app loads nothing from a third party (PLAN.md §3). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' blob: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="A 3D space explorer for kids." />
    <title>Universe Explorer</title>
    <meta name="theme-color" content="#060914" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/ui/app.css" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="3D view of space"></canvas>
    <figure id="picture" hidden>
      <img id="picture-image" alt="" />
      <figcaption id="picture-credit"></figcaption>
    </figure>
    <header class="top">
      <div class="brand">
        <h1 id="title"></h1>
        <p id="scale-label" aria-live="polite"></p>
      </div>
      <div id="main-tabs"></div>
      <div class="tools" id="tools"></div>
    </header>
    <div id="settings-slot"></div>
    <div id="card-slot"></div>
    <div id="compare-slot"></div>
    <div id="grownups-slot"></div>
    <div class="view-controls" id="view-controls" role="group"></div>
    <p class="first-hint" id="first-hint" hidden></p>
    <nav class="tray" id="tray"></nav>
    <!-- After the controls in reading order, so keyboard users reach the controls first. -->
    <div id="markers"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
